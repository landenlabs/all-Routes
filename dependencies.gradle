// TWC Auto weather app - 2023
// Project dependencies to keep all modules in sync.

// println "=========== dependencies included ============= for " + project.projectDir.path
def appVersion  = "6.04.19"  // 2026 April(04) 19th
def appVernCode = 604019    // this represents 1 or more digits for major, 2 for minor and 3 patch
        
ext.versions = [
    targetSdk       : 36,
    compileSdk      : 36,
    minSdk          : 29,   // mapsdkv2/Pangea 5.11 (com.weather.mapsdk AAR) requires minSdk >= 29

    // https://github.com/TheWeatherCompany/pangea-mobile
    // mapSdkV1        : '5.7.2914',   // https://android-repo.media.weather.com/MobileMapSDK/Maven/com/
    // pangea4         : "4.20.0",      // https://github.com/TheWeatherCompany/maps-pangea-android/releases
        // https://repo.artifacts.weather.com/ui/native/pangea-mobile-kotlin-local/com/weather/pangea/android/pangeamapbox/
    pangea5         : "5.11.1",      // https://github.com/TheWeatherCompany/pangea-mobile
        // https://repo.artifacts.weather.com/ui/native/pangea-mobile-kotlin-local/com/weather/pangea/kotlin/pangea-mapbox-android/
    mapSdkV2        : "6.7.20",     // libs/mapsdkv2-<ver>.aar, built from mapsdk-v2 project (wraps pangea5)
    wxDataVersion   : '2.26.0720',
    okHttp3         : '5.3.2',      // https://square.github.io/okhttp/changelog/ (synced with Pangea)

    appVersion      : appVersion,
    appVernCode     : appVernCode,   
    sdkVersion      : appVersion,
    sdkVernCode     : appVernCode,

    appcompat       : "1.7.1",      // https://developer.android.com/jetpack/androidx/releases/appcompat
    material        : "1.13.0",
    annotation      : "1.9.1",
    work            : "2.11.2",      // https://androidx.tech/artifacts/work/work-runtime/
]

// Limit languages to following list. Also look at 'resConfig' and 'resourceConfigurations'
ext.resLangs = ['en', 'fr']
// See ndk.abiFilters
// ext.cpuTypes = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
ext.cpuTypes = ['armeabi-v7a', 'arm64-v8a',  'x86_64']

// Load Gradle credentials
ext.twc_sign_props = new Properties()
def propFile = file("${project.rootDir}/twc_credentials_sign.properties")
if (propFile.exists()) {
    propFile.withInputStream { twc_sign_props.load(it) }
}

ext.releasekeyfile = "${project.rootDir}/assets/sign/${twc_sign_props.RELEASE_KEY_STORE_FILE ?: 'release.keystore'}"
ext.debugkeyfile = "${project.rootDir}/assets/sign/twc_debug.jks"


