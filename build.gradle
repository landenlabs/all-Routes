// all-routes
// Top-level build file

buildscript {
    ext {
        // https://developer.android.com/studio/releases/gradle-plugin?buildsystem=ndk-build#updating-gradle
        // https://mvnrepository.com/artifact/com.android.tools.build/gradle?repo=google
        desugar = true      // Required with Pangea 5+ and gradle 8.2+
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }
        
        // Apply toolchain if the java plugin is present (includes Android)
        if (project.plugins.hasPlugin('java') || project.hasProperty('android')) {
            java {
                toolchain {
                    // Pangea 5 ships some artifacts compiled with a JDK 21 target (class file
                    // version 65) - javac itself must run on JDK 21+ to read them, even though
                    // we still emit Java 17 bytecode via sourceCompatibility/targetCompatibility above.
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
    }
}