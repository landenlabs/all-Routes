plugins {
    id 'com.android.library'
}

android {
    apply from: "${project.rootDir}/dependencies.gradle"
    namespace = 'landenlabs.lib_data'
    compileSdk = versions.compileSdk

    defaultConfig {
        minSdk = versions.minSdk
        targetSdk = versions.targetSdk

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles("consumer-rules.pro")
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.10.0"
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.10.0'

    ext.USE_TWC_MAVEN = false
    if (USE_TWC_MAVEN) {
        api "com.wsi.wxdata:wxdata:$versions.wxDataVersion"
        // api(name: 'wxdata', ext: 'aar', version: '$versions.wxDataVersion')
    } else {
        api rootProject.files("libs/wxdata-${versions.wxDataVersion}.aar")

        // https://square.github.io/okhttp/changelog/
        // https://github.com/square/okhttp/releases
        api "com.squareup.okhttp3:okhttp:$versions.okHttp3"
        api "com.squareup.okhttp3:logging-interceptor:$versions.okHttp3"

        implementation "com.squareup.retrofit2:retrofit:2.9.0"      // 2.11.0
        implementation "com.squareup.retrofit2:converter-gson:2.11.0"

        implementation "com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0"
        implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
        implementation "io.reactivex.rxjava2:rxjava:2.2.21"
        // wxdata 2.26+ uses RxJava 3 types in its public API (e.g. WxAlertsFetcher.setUnit())
        // and builds its Retrofit client with RxJava3CallAdapterFactory internally.
        api "io.reactivex.rxjava3:rxandroid:3.0.2"
        api "io.reactivex.rxjava3:rxjava:3.1.12"
        api "com.squareup.retrofit2:adapter-rxjava3:2.11.0"
        implementation "com.google.code.gson:gson:2.10"
        implementation "org.greenrobot:eventbus:3.3.1"
    }
    // api project(path: ':wx_lib_data')
    // api(name: 'wx_lib_data', ext: 'aar')
    // api(name: 'wx_lib_data', ext: 'aar', version: '$versions.sdkVersion')
}